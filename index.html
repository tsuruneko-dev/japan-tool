<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Japan-Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Bahnhofsschild-Karte im Zentrum; Liste gruppiert nach Kategorie wie Gleisanzeigen */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#14213a; --muted:#5a6678; --line:#d5ddd9;
  --accent:#00875a; --accent-ink:#ffffff; --accent-soft:#dff1e9;
  --miss:#b4461a; --miss-soft:#f7e6dc;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131e; --surface:#162033; --ink:#e7edf6; --muted:#97a3b6; --line:#28344c;
  --accent:#33c48a; --accent-ink:#06150f; --accent-soft:#143528;
  --miss:#f08a5d; --miss-soft:#3a2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e; --surface:#162033; --ink:#e7edf6; --muted:#97a3b6; --line:#28344c;
  --accent:#33c48a; --accent-ink:#06150f; --accent-soft:#143528;
  --miss:#f08a5d; --miss-soft:#3a2219; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .jp{font-family:var(--f-jp);font-weight:700;font-size:1.7rem;letter-spacing:.06em;line-height:1.1}
.brand .de{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .n{font-family:var(--f-mono);font-size:.75rem;opacity:.75}

/* ---------- Karten ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=range]{accent-color:var(--accent);width:100%;margin:6px 0 0}
.lbl .val{font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500;margin-left:4px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(20,33,58,.35);display:flex;flex-direction:column;overflow:hidden}
.back{transform:rotateY(180deg)}
.face .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;text-align:center}
.face .strip{background:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:.78rem;font-weight:600;letter-spacing:.06em;gap:10px}
.strip .side{font-family:var(--f-mono);font-weight:500;opacity:.9}
.big-de{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:600;line-height:1.25;text-wrap:balance}
.big-jp{font-family:var(--f-jp);font-weight:700;font-size:clamp(1.9rem,7vw,2.9rem);line-height:1.25;letter-spacing:.04em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.romaji{font-size:1.15rem;font-style:italic;color:var(--muted);letter-spacing:.02em}
.note{font-size:.85rem;color:var(--muted);max-width:40ch}
.ctx{font-size:.9rem;line-height:1.4;color:var(--muted);max-width:36ch;text-wrap:balance;display:flex;flex-direction:column;align-items:center;gap:4px}
.ctx::before{content:"Kontext";font-size:.62rem;line-height:1.5;text-transform:uppercase;letter-spacing:.12em;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.item .ctx{font-size:.8rem;align-items:flex-start;margin-top:4px;max-width:none;gap:2px}
.hint{font-size:.8rem;color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink);text-decoration:none}
.audio{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.audiomsg{font-size:.8rem;color:var(--miss);max-width:40ch}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-weight:600;font-size:.95rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.miss{background:var(--miss-soft);border-color:transparent;color:var(--miss)}
.btn.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
:root[data-theme="dark"] .btn.ok{color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.kbd{font-family:var(--f-mono);font-size:.7rem;opacity:.6;margin-left:6px}
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .score{font-family:var(--f-mono);font-size:2.2rem;font-variant-numeric:tabular-nums}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- Liste ---------- */
.listtop{display:grid;grid-template-columns:1fr auto;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
form.edit{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.edit .full{grid-column:1/-1}
form.edit .jpin{font-family:var(--f-jp);font-size:1.1rem}
form.edit .btns{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.group{display:flex;flex-direction:column;gap:0}
.group h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between}
.group h2 .n{font-family:var(--f-mono);font-weight:400}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .de{font-weight:500;min-width:0}
.item .jpcol{min-width:0;display:flex;flex-direction:column}
.item .jp{font-family:var(--f-jp);font-size:1.15rem;font-weight:700;letter-spacing:.03em}
.item .ro{font-style:italic;color:var(--muted);font-size:.9rem}
.item .meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stat{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{font-weight:500;color:var(--accent)} .stat s{text-decoration:none;color:var(--miss)}
.tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.mini{border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600;padding:4px 6px;border-radius:6px}
.mini:hover{background:var(--bg);color:var(--ink)}
.mini.danger{color:var(--miss)}
.mini.icon{padding:4px 7px;font-size:.9rem;line-height:1}
.item .sub{font-size:.78rem;color:var(--muted);margin-top:2px}

/* ---------- Bucket ---------- */
.blist{display:flex;flex-direction:column;gap:8px}
.brow{position:relative;display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.brow.shift{transition:transform .15s ease}
.brow.dragging{z-index:5;box-shadow:0 14px 34px -12px rgba(20,33,58,.5);border-color:var(--accent)}
.brow .dragh{padding:4px 6px;margin:-2px 0}
.brow input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin:5px 0 0;flex:none}
.brow .btext{flex:1;min-width:140px;overflow-wrap:anywhere;padding-top:4px}
.brow.done .btext{color:var(--muted);text-decoration:line-through}
.brow form.bedit{flex:1;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.brow form.bedit input[type=text]{flex:1;min-width:120px}
#bucketAddForm{display:grid;grid-template-columns:1fr auto;gap:8px}
@media (max-width:560px){#bucketAddForm{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.brow.shift{transition:none}}
.suggest{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.suggest .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.suggest .head .lbl{color:var(--accent)}
.suggest .sde{font-weight:600;font-size:1.02rem}
.suggest .sctx{font-size:.8rem;color:var(--muted);margin-top:2px}
.suggest .sjp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:4px}
.suggest .sjp .jp{font-family:var(--f-jp);font-weight:700;font-size:1.1rem}
.suggest .sjp .ro{font-style:italic;color:var(--muted);font-size:.9rem}
.suggest .sbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.suggest .btn{padding:8px 12px;font-size:.85rem}
.suggest .mini{text-align:center}
@media (max-width:560px){.suggest{grid-template-columns:1fr}.suggest .sbtns{flex-direction:row;flex-wrap:wrap}}
.aibox{display:flex;flex-direction:column;gap:8px}
.aibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aibar .btn{border-style:dashed;border-color:var(--accent);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;max-width:calc(100% - 32px)}
.status{font-size:.75rem;color:var(--muted)}
.authform{width:min(100%,360px);display:flex;flex-direction:column;gap:8px}
.authform input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.authbuttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.8rem;color:var(--muted)}
.authbar b{color:var(--ink);font-weight:600}
.authgate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.authcard{width:min(100%,480px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:0 12px 30px -18px rgba(20,33,58,.35);display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.authcard strong{color:var(--ink);font-size:1.05rem}
.authcard p{margin:0;color:var(--muted);line-height:1.5}
.accountbar{margin-bottom:12px}

/* ---------- Shopping ---------- */
.fxbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--muted)}
.fxbar b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.fxbar input{width:110px;padding:6px 8px}
.shopsum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 28px}
.shopsum div{display:flex;flex-direction:column;gap:2px}
.shopsum .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.95rem}
.shopsum .v small{color:var(--muted);font-size:.8rem;margin-left:6px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sitem.bought .sphoto img,.sitem.bought .sbody>*:not(.sact){opacity:.55}
.sphoto{aspect-ratio:4/3;max-width:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.sphoto img{width:100%;height:100%;object-fit:contain;display:block}
.sphoto .none{font-family:var(--f-jp);font-size:1.4rem;letter-spacing:.1em;opacity:.5}
.spill{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.sbody{padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.sname{font-weight:600;font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.sdesc{font-size:.85rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.pwv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.pwv b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.pwv .e{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.prange{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--line) 50%,var(--miss));opacity:.9;margin:4px 6px}
.prange i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);transform:translate(-50%,-50%)}
.pmm{display:flex;justify-content:space-between;gap:10px}
.pmm div{display:flex;flex-direction:column;gap:1px;min-width:0}
.pmm div:last-child{text-align:right}
.pmm b{font-family:var(--f-mono);font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums}
.pmm .e{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sact{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:8px;align-items:center}
.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fxh{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);min-height:1.2em}
.phrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.phrow img{width:84px;height:63px;object-fit:contain;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.phgrid{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.phcell{display:flex;flex-direction:column;gap:2px;align-items:center;width:96px}
.phcell .pimg{position:relative;width:96px;height:72px;border-radius:6px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.phcell .pimg img{width:100%;height:100%;object-fit:contain;display:block}
.phcell.main .pimg{border:2px solid var(--accent)}
.phcell .pbadge{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.phcell .mini{font-size:.72rem;padding:2px 4px}
.phadd{width:96px;height:72px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;background:var(--surface)}
.phadd:hover{border-color:var(--accent);color:var(--ink)}
.phadd:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.phadd input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sgal{display:flex;flex-direction:column;gap:8px;min-width:0}
.sdots{display:flex;gap:6px;flex-wrap:wrap}
.sdots button{width:48px;height:48px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--bg);overflow:hidden;opacity:.7}
.sdots button[aria-pressed="true"]{border:2px solid var(--accent);opacity:1}
.sdots img{width:100%;height:100%;object-fit:contain;display:block}
.sthumb{position:relative}
.sthumb .pcount{position:absolute;right:2px;bottom:2px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:.6rem;line-height:1;padding:2px 4px;border-radius:4px}
input[type=file]{font-size:.85rem;max-width:100%}
.warn{font-size:.8rem;color:var(--miss)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.p3.fixed{grid-template-columns:minmax(0,1fr)}
.p3.fixed .field{max-width:220px}
@media (max-width:560px){.p3{grid-template-columns:1fr}}
.slisttop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slist{display:flex;flex-direction:column;gap:8px}
.viewseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.viewseg button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted)}
.viewseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sgallery{columns:2;column-gap:12px}
@media (min-width:640px){.sgallery{columns:3}}
@media (min-width:900px){.sgallery{columns:4}}
.gtile{break-inside:avoid;margin:0 0 12px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:block;width:100%}
.gtile img{width:100%;display:block}
.gtile .none{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:var(--f-jp);color:var(--muted);opacity:.6}
.gtile.bought{opacity:.55}
.gtile .gcap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);color:#fff}
.gtile .gname{font-size:.85rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.gtile .gprice{font-family:var(--f-mono);font-size:.76rem;opacity:.92;margin-top:2px}
.gtile .gtag{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.srow.shift{transition:transform .15s ease}
.srow.dragging{z-index:5;box-shadow:0 14px 34px -12px rgba(20,33,58,.5);border-color:var(--accent)}

const legacyKey = x => [x?.de,x?.ro,x?.jp,x?.cat].map(norm).join("|");
const legacyBucketKey = x => norm(x?.text);
const legacyShopKey = x => norm(x?.name);
const dataOnly = x => { const y={...(x||{})}; delete y.id; return y; };
async function importLegacyRows(table, cloudRows, legacyRows, keyOf, defaults=[]){
  const source = legacyRows.length ? legacyRows : (!cloudRows.length ? defaults : []);
  const known = new Set(cloudRows.map(row=>keyOf(row.item)));
  const pending=[];
  for(const old of source){
    const item=dataOnly(old), key=keyOf(item);
    if(!key || known.has(key)) continue;
    known.add(key); pending.push(item);
  }
  if(!pending.length) return cloudRows;
  const {data,error}=await S.supabase.from(table).insert(pending.map(item=>({item}))).select("id,item");
  if(error) throw error;
  return [...cloudRows,...(data||[])];
}
async function prepareLegacyShopItem(old){
  const item=dataOnly(old), saved=[];
  for(const photo of photosOf(old)){
    if(/^data:image\//.test(photo)){
      const blob=await (await fetch(photo)).blob();
      const asset=await S.assets.upload(await shrinkImage(blob));
      saved.push(asset.id);
    }
  }
  item.photos=saved; item.photo=saved[0]||null;
  return item;
}
async function loadCloudApp(){
  if(!S.supabase || !S.authUser) return;
  const userId=S.authUser.id;
  S.appLoading=true; S.appLoadError=""; renderGlobalAuth();
  try{
    const [phraseRes,shopRes,bucketRes,settingsRes]=await Promise.all([
      S.supabase.from("learning_items").select("id,item").order("created_at",{ascending:true}),
      S.supabase.from("shopping_items").select("id,item").order("created_at",{ascending:true}),
      S.supabase.from("bucket_items").select("id,item").order("created_at",{ascending:true}),
      S.supabase.from("app_settings").select("value").eq("key","fx").maybeSingle()
    ]);
    for(const res of [phraseRes,shopRes,bucketRes,settingsRes]) if(res.error) throw res.error;
    if(S.authUser?.id!==userId) return;
    const legacyItems=ls.get("jp.items"), legacyShop=ls.get("jp.shop"), legacyBucket=ls.get("jp.bucket");
    const phrases=await importLegacyRows("learning_items",phraseRes.data||[],Array.isArray(legacyItems)?legacyItems:[],legacyKey,FALLBACK.map((x,i)=>({...x,created:i,ok:0,miss:0})));
    let shopping=shopRes.data||[];
    const shopKnown=new Set(shopping.map(row=>legacyShopKey(row.item))), shopPending=[];
    for(const old of Array.isArray(legacyShop)?legacyShop:[]){
      const key=legacyShopKey(old); if(!key||shopKnown.has(key)) continue;
      shopKnown.add(key); shopPending.push(await prepareLegacyShopItem(old));
    }
    if(shopPending.length){
      const {data,error}=await S.supabase.from("shopping_items").insert(shopPending.map(item=>({item}))).select("id,item");
      if(error) throw error; shopping=[...shopping,...(data||[])];
    }
    const bucket=await importLegacyRows("bucket_items",bucketRes.data||[],Array.isArray(legacyBucket)?legacyBucket:[],legacyBucketKey);
    if(S.authUser?.id!==userId) return;
    S.items=(phrases||[]).map(row=>({...row.item,id:row.id}));
    S.shop=(shopping||[]).map(row=>({...row.item,id:row.id}));
    S.bucket=(bucket||[]).map(row=>({...row.item,id:row.id}));
    S.fx=settingsRes.data?.value||ls.get("jp.fx")||{...DEFAULT_FX};
    if(!settingsRes.data){
      const {error}=await S.supabase.from("app_settings").upsert({key:"fx",value:S.fx});
      if(error) throw error;
    }
    try{ ["jp.items","jp.shop","jp.bucket","jp.fx"].forEach(key=>localStorage.removeItem(key)); }catch(_){ }
    S.loaded=true; S.shopLoaded=true; S.bucketLoaded=true; S.appLoading=false; S.appLoadError="";
    onData(); renderAll();
    void refreshFx();
  }catch(error){
    if(S.authUser?.id!==userId) return;
    S.appLoading=false; S.appLoadError="Prüfe deine Internetverbindung und versuche es noch einmal.";
    renderGlobalAuth();
  }
}

async function hydrateShopPhotos(){
  if(!S.supabase || !S.authUser) return;
  for(const img of document.querySelectorAll("img[data-photo-id]")){
    const path=img.dataset.photoId; if(!path) continue;
    const cached=S.photoUrls.get(path); if(cached){ img.src=cached; continue; }
    if(S.photoLoads.has(path)) continue;
    S.photoLoads.add(path);
    try{
      const {data,error}=await S.supabase.storage.from("japan-shopping").download(path);
      if(error) throw error;
      const url=URL.createObjectURL(data); S.photoUrls.set(path,url);
      document.querySelectorAll("img[data-photo-id]").forEach(node=>{if(node.dataset.photoId===path) node.src=url;});
    }catch(e){ img.alt="Foto konnte nicht geladen werden"; }
    finally{ S.photoLoads.delete(path); }
  }
}

const FX_API = "https://api.frankfurter.dev/v2/rate/EUR/JPY";
let fxRefreshTimer = null;
async function refreshFx(){
  if(!S.supabase || !S.authUser || !S.shopLoaded) return;
  const userId=S.authUser.id, controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);
  try{
    const response=await fetch(FX_API,{cache:"no-store",signal:controller.signal});
    if(!response.ok) return;
    const quote=await response.json(), rate=Number(quote.rate);
    if(!quote.date || !Number.isFinite(rate) || rate<=0 || S.authUser?.id!==userId) return;
    if(S.fx?.date===quote.date && S.fx?.rate===rate && S.fx?.updated) return;
    await shopStore.fx({rate,date:quote.date,updated:Date.now()});
  }catch(_){ /* Der zuletzt gespeicherte Kurs bleibt bei Netzwerkausfall erhalten. */ }
  finally{ clearTimeout(timeout); }
}

async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const s = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

const sortKey = i => isNum(i.order) ? i.order : (i.created || 0);
const shopSorted = () => [...S.shop].sort((a,b) => (!!a.bought - !!b.bought) || (sortKey(a) - sortKey(b)));
function shopMove(id, to){
  const L = shopSorted(), from = L.findIndex(i => i.id === id);
  if (from < 0 || to < 0 || to >= L.length || to === from) return;
  const [it] = L.splice(from, 1); L.splice(to, 0, it);
  const prev = L[to-1], next = L[to+1];
  let k = prev && next ? (sortKey(prev) + sortKey(next)) / 2 : prev ? sortKey(prev) + 1000 : sortKey(next) - 1000;
  if (prev && next && (k <= sortKey(prev) || k >= sortKey(next))){
    // Kein Platz mehr zwischen den Nachbarn: alle neu durchnummerieren
    L.forEach((x, n) => { x.order = (n + 1) * 1000; });
    renderShop();
    safe(async () => { for (const x of L) await shopStore.update(x.id, {order: x.order}); });
    return;
  }
  it.order = k; renderShop();
  safe(() => shopStore.update(id, {order: k}));
}
function bucketMove(id, to){
  const L = bucketSorted(), from = L.findIndex(i => i.id === id);
  if (from < 0 || to < 0 || to >= L.length || to === from) return;
  const [it] = L.splice(from, 1); L.splice(to, 0, it);
  const prev = L[to-1], next = L[to+1];
  let k = prev && next ? (sortKey(prev) + sortKey(next)) / 2 : prev ? sortKey(prev) + 1000 : sortKey(next) - 1000;
  if (prev && next && (k <= sortKey(prev) || k >= sortKey(next))){
    L.forEach((x, n) => { x.order = (n + 1) * 1000; });
    renderBucket();
    safe(async () => { for (const x of L) await bucketStore.update(x.id, {order: x.order}); });
    return;
  }
  it.order = k; renderBucket();
  safe(() => bucketStore.update(id, {order: k}));
}

function rowDragStart(e, handle, rowSel, moveFn, pendingKey, renderFn){
  const row = handle.closest(rowSel), listEl = row && row.parentElement;
  if (!row || !listEl) return;
  e.preventDefault();
  const rows = [...listEl.children], idx = rows.indexOf(row), id = row.dataset.id;
  const tops = rows.map(r => { const b = r.getBoundingClientRect(); return {top: b.top + scrollY, h: b.height}; });
  const gap = rows.length > 1 ? Math.max(0, tops[1].top - tops[0].top - tops[0].h) : 8;
  const shiftBy = tops[idx].h + gap, startY = e.pageY;
  let to = idx, moved = false;
  S.dragging = true;
  row.classList.add("dragging"); rows.forEach(r => { if (r !== row) r.classList.add("shift"); });
  try { handle.setPointerCapture(e.pointerId); } catch(_){}
  const move = ev => {
    const dy = ev.pageY - startY; if (Math.abs(dy) > 3) moved = true;
    row.style.transform = `translateY(${dy}px)`;
    const cy = tops[idx].top + tops[idx].h / 2 + dy;
    to = idx;
    rows.forEach((r, n) => { if (n === idx) return; const mid = tops[n].top + tops[n].h / 2;
      if (n < idx && cy < mid) to = Math.min(to, n); if (n > idx && cy > mid) to = Math.max(to, n); });
    rows.forEach((r, n) => { if (n === idx) return; let t = 0;
      if (idx < to && n > idx && n <= to) t = -shiftBy; if (to < idx && n >= to && n < idx) t = shiftBy;
      r.style.transform = t ? `translateY(${t}px)` : ""; });
    if (ev.clientY < 70) scrollBy(0, -14); else if (ev.clientY > innerHeight - 70) scrollBy(0, 14);
  };
  const end = () => {
    handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", end); handle.removeEventListener("pointercancel", end);
    rows.forEach(r => { r.style.transform = ""; r.classList.remove("shift", "dragging"); });
    S.dragging = false;
    if (moved && to !== idx) moveFn(id, to);
    else if (S[pendingKey]){ S[pendingKey] = false; renderFn(); }
  };
  handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
}

const bucketDragStart = (e, h) => rowDragStart(e, h, ".brow", bucketMove, "bucketPending", renderBucket);
document.addEventListener("pointerdown", e => {
  const h = e.target.closest && e.target.closest(".dragh");
  if (!h || !(e.button === 0 || e.pointerType !== "mouse")) return;

});
document.addEventListener("keydown", e => {

const store = {

  async update(id, patch){
    if (!S.supabase || !S.authUser) throw new Error("Bitte melde dich an, um Karteikarten zu speichern.");
    const next={...(S.items.find(i=>i.id===id)||{}),...patch}; delete next.id;
    const {error}=await S.supabase.from("learning_items").update({item:next}).eq("id",id);
    if(error) throw error; Object.assign(S.items.find(i=>i.id===id)||{},patch); onData();
  },
  async remove(id){

    const {error}=await S.supabase.from("learning_items").delete().eq("id",id);

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function deckPool(){

  const back = S.dirJp ? `${deSide}${it.note?`<div class="note">${esc(it.note)}</div>`:""}${speak}` : `${jpSide}${it.note?`<div class="note">${esc(it.note)}</div>`:""}${speak}`;
  const strip = (side) => `<div class="strip"><span>${esc(catOf(it))}</span><span class="side">${side}</span></div>`;
  area.innerHTML = `
    <div class="stage">
      <div class="card ${S.flipped?"flipped":""}" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
        <div class="face front"><div class="body">${front}<span class="hint">Tippen zum Umdrehen</span></div>${strip(S.dirJp?"日本語":"DEUTSCH")}</div>
        <div class="face back"><div class="body">${back}</div>${strip(S.dirJp?"DEUTSCH":"日本語 · RŌMAJI")}</div>
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      ${S.flipped
        ? `<button class="btn miss" data-act="miss">Nochmal<span class="kbd">1</span></button><button class="btn ok" data-act="ok">Gewusst<span class="kbd">2</span></button>`
        : `<button class="btn primary" data-act="flip" style="grid-column:1/-1">Umdrehen<span class="kbd">Leertaste</span></button>`}
    </div>`;
}

function renderList(){
  renderSuggest(); renderVT();
  const cs = cats();
  if (S.listCat!=="Alle" && !cs.includes(S.listCat)) S.listCat="Alle";
  $("listChips").innerHTML = ["Alle",...cs].map(c=>`<button class="chipbtn" data-cat="${esc(c)}" aria-pressed="${c===S.listCat}">${esc(c)}</button>`).join("");

  const slot = $("formSlot");
  if (S.editing){
    const e = S.editing==="new" ? {de:"",ctx:"",ro:"",jp:"",cat:S.listCat!=="Alle"?S.listCat:"",note:""} : byId(S.editing) || {};
    if (!slot.querySelector("form") || slot.dataset.for !== S.editing){
      slot.dataset.for = S.editing;
      slot.innerHTML = `<form class="edit" id="editForm">
        <div class="field full"><label class="lbl" for="fDe">Deutsch</label><input type="text" id="fDe" required value="${esc(e.de)}" placeholder="z. B. Wo ist der Bahnhof?"></div>
        <div class="field full"><label class="lbl" for="fCtx">Kontext (optional)</label><input type="text" id="fCtx" value="${esc(e.ctx)}" placeholder="z. B. Passanten auf der Straße fragen"></div>
        <div class="field"><label class="lbl" for="fRo">Romaji</label><input type="text" id="fRo" required value="${esc(e.ro)}" placeholder="eki wa doko desu ka"></div>
        <div class="field"><label class="lbl" for="fJp">Japanisch</label><input type="text" id="fJp" class="jpin" lang="ja" value="${esc(e.jp)}" placeholder="駅はどこですか"></div>
        <div class="field"><label class="lbl" for="fCat">Kategorie</label><input type="text" id="fCat" list="catList" value="${esc(e.cat)}" placeholder="z. B. Restaurant"></div>
        <div class="field"><label class="lbl" for="fNote">Notiz (optional)</label><input type="text" id="fNote" value="${esc(e.note)}" placeholder="z. B. höfliche Form"></div>
        <div class="btns"><button type="button" class="btn" data-act="cancel">Abbrechen</button><button type="submit" class="btn primary">${S.editing==="new"?"Hinzufügen":"Speichern"}</button></div>
      </form>`;
      setTimeout(()=>$("fDe")?.focus(), 0);
    }
  } else { slot.innerHTML = ""; slot.dataset.for = ""; }

  const q = S.q.trim().toLowerCase();
  const list = S.items.filter(i => (S.listCat==="Alle" || catOf(i)===S.listCat) &&
    (!q || [i.de,i.ctx,i.ro,i.jp,i.note].some(v => String(v||"").toLowerCase().includes(q))));
  const area = $("listArea");
  if (!S.loaded){ area.innerHTML = `<div class="empty">Deine Phrasen werden geladen …</div>`; return; }
  if (!S.items.length){ area.innerHTML = `<div class="empty"><strong>Noch leer</strong><span>Füg oben deine erste Phrase hinzu.</span></div>`; return; }
  if (!list.length){ area.innerHTML = `<div class="empty">Nichts gefunden für „${esc(S.q)}“.</div>`; return; }

  const groups = {};
  list.forEach(i => (groups[catOf(i)] ||= []).push(i));
  area.innerHTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,"de")).map(g => `
    <div class="group"><h2><span>${esc(g)}</span><span class="n">${groups[g].length}</span></h2>
      <div class="rows">${groups[g].map(i => `
        <div class="item">
          <div class="de">${esc(i.de)}${i.ctx?`<div class="ctx">${esc(i.ctx)}</div>`:""}${i.note?`<div class="sub">${esc(i.note)}</div>`:""}</div>
          <div class="jpcol">${i.jp?`<span class="jp" lang="ja">${esc(i.jp)}</span>`:""}<span class="ro">${esc(i.ro)}</span></div>
          <div class="meta">
            ${i.ex?`<span class="tag">Beispiel</span>`:""}
            ${(i.ok||i.miss)?`<span class="stat" title="gewusst / nicht gewusst"><b>✓${i.ok||0}</b> <s>✗${i.miss||0}</s></span>`:""}
            ${S.confirmDel===i.id
              ? `<span class="stat">Löschen?</span><button class="mini danger" data-act="delYes" data-id="${i.id}">Ja</button><button class="mini" data-act="delNo">Nein</button>`
              : `<button class="mini" data-act="edit" data-id="${i.id}">Bearbeiten</button><button class="mini danger" data-act="del" data-id="${i.id}">Löschen</button>`}
          </div>
        </div>`).join("")}</div></div>`).join("");
}

/* ---------- Aktionen ---------- */
function setView(v){ S.view=v; ls.set("jp.view",v); renderAll(); }
function flip(){ if (S.idx < S.deck.length){ S.flipped = !S.flipped; renderCards(); } }
function answer(ok){
  if (!S.flipped || S.idx >= S.deck.length) return;
  const it = byId(S.deck[S.idx]);
  if (ok) S.res.ok++; else S.res.miss.push(it.id);
  S.idx++; S.flipped=false; renderCards();
  safe(() => store.update(it.id, ok ? {ok:(it.ok||0)+1} : {miss:(it.miss||0)+1}));
}
function audioMsg(t){ const m = $("audioMsg"); if (m){ m.textContent = t; m.hidden = !t; } }
function jaVoices(){
  return new Promise(res => {
    const find = () => speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang || ""));
    const now = find(); if (now.length || speechSynthesis.getVoices().length) return res(now);
    const t = setTimeout(() => res(find()), 1500);
    speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); res(find()); }, {once:true});
  });
}
let curAudio = null;
async function speak(slow){
  const it = byId(S.deck[S.idx]); if (!it) return;
  const text = it.jp || it.ro;
  audioMsg("");
  // 1) Aufnahme zur Karte, falls vorhanden und zum aktuellen Text passend
  if (it.audio && it.audioFor === text){
    try {
      if (curAudio) curAudio.pause();
      curAudio = new Audio(it.audio);
      curAudio.preservesPitch = true;
      curAudio.playbackRate = slow ? 0.7 : 1;
      await curAudio.play();
      return;
    } catch(e){ /* weiter mit Sprachausgabe des Geräts */ }
  }
  // 2) Sprachausgabe des Geräts
  const fallback = " Für diese Karte gibt es noch keine Aufnahme. In der Liste kannst du sie mit „Fehlende Aufnahmen erstellen“ anlegen lassen.";
  if (!("speechSynthesis" in window)) return audioMsg("Dein Browser hat keine Sprachausgabe." + fallback);
  try {
    const vs = await jaVoices();
    if (!vs.length) return audioMsg("Auf diesem Gerät ist keine japanische Stimme installiert." + fallback);
    const v = vs.find(v => /google|nanami|kyoko|otoya|haruka/i.test(v.name)) || vs[0];
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.voice = v; u.rate = slow ? 0.6 : 0.9;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") audioMsg("Die Sprachausgabe wurde blockiert." + fallback); };
    speechSynthesis.speak(u);
    setTimeout(() => { if (!started && !speechSynthesis.speaking) audioMsg("Die Sprachausgabe hat nicht gestartet." + fallback); }, 2500);
  } catch(e){ audioMsg("Die Sprachausgabe ist hier nicht verfügbar." + fallback); }
}

$("tabCards").onclick = () => setView("cards");
$("tabList").onclick = () => setView("list");
$("tabShop").onclick = () => setView("shop");
$("tabBucket").onclick = () => setView("bucket");
$("deckCat").onchange = e => { S.deckCat = e.target.value; ls.set("jp.cat",S.deckCat); buildDeck(); renderCards(); };
$("dirBtn").onclick = () => { S.dirJp = !S.dirJp; ls.set("jp.dir",S.dirJp); S.flipped=false; renderCards(); };
$("hardBtn").onclick = () => { S.hard = !S.hard; buildDeck(); renderCards(); };
function limitLabel(v, n){ $("limitTxt").textContent = v >= n ? `Alle (${n})` : `${v} von ${n}`; }
$("limitR").oninput = e => limitLabel(+e.target.value, +e.target.max);
$("limitR").onchange = e => {
  const v = +e.target.value, n = +e.target.max;
  S.limit = v >= n ? 0 : v; ls.set("jp.limit", S.limit);
  e.target.blur(); buildDeck(); renderCards();
};
$("q").oninput = e => { S.q = e.target.value; renderList(); };
$("addBtn").onclick = () => { S.editing="new"; renderList(); };

document.addEventListener("click", e => {
  if (e.target.closest("#globalSignOut")){ safe(async()=>{ const {error}=await S.supabase.auth.signOut(); if(error) throw error; }); return; }
  if (e.target.closest("#retryCloudLoad")){ loadCloudApp(); return; }
  const chip = e.target.closest("[data-cat]");
  if (chip){ S.listCat = chip.dataset.cat; renderList(); return; }
  if (e.target.closest("a")) return;
  const b = e.target.closest("[data-act]");
  if (!b){ if (e.target.closest("#card")) flip(); return; }
  const id = b.dataset.id;
  switch(b.dataset.act){
    case "flip": flip(); break;
    case "ok": answer(true); break;
    case "miss": answer(false); break;
    case "speak": e.stopPropagation(); speak(false); break;
    case "speakSlow": e.stopPropagation(); speak(true); break;
    case "redoMiss": buildDeck(shuffle(S.res.miss)); renderCards(); break;
    case "reshuffle": buildDeck(); renderCards(); break;
    case "gotoAdd": S.editing="new"; setView("list"); break;
    case "edit": S.editing=id; S.confirmDel=null; renderList(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "cancel": S.editing=null; renderList(); break;
    case "del": S.confirmDel=id; renderList(); break;
    case "delNo": S.confirmDel=null; renderList(); break;
    case "delYes": S.confirmDel=null; safe(()=>store.remove(id)); break;
    case "sugAdd": { const p=S.sug; if(!p) break; S.sugAdded.add(p.ro); pickSug(p); renderList();
      safe(async()=>{ await store.add({de:p.de,ctx:p.ctx,ro:p.ro,jp:p.jp,cat:p.cat,note:"",ex:false}); toast("Hinzugefügt"); }); break; }
    case "vtGo": vtGo(); break;
    case "dragNoop": break;
    case "shopToggle": if (S.shopOpenSet.has(id)) S.shopOpenSet.delete(id); else S.shopOpenSet.add(id); saveOpen(); renderShop(); break;
    case "shopAll": { const L = shopSorted(); const all = L.every(i => S.shopOpenSet.has(i.id));
      S.shopOpenSet = new Set(all ? [] : L.map(i => i.id)); saveOpen(); renderShop(); break; }
    case "shopAdd": shopOpen("new"); break;
    case "shopViewList": S.shopView = "list"; ls.set("jp.shopView", "list"); renderShop(); break;
    case "shopViewGallery": S.shopView = "gallery"; ls.set("jp.shopView", "gallery"); renderShop(); break;
    case "shopGalleryOpen": S.shopView = "list"; ls.set("jp.shopView", "list"); S.shopOpenSet.add(id); saveOpen(); renderShop();
      requestAnimationFrame(() => { const el = document.querySelector(`.srow[data-id="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({block:"center", behavior:"smooth"}); }); break;
    case "shopEdit": shopOpen(id); break;
    case "shopCancel": shopOpen(null); break;
    case "phRm": { const [x] = S.shopPhotos.splice(+b.dataset.k, 1); if (x && x.url) URL.revokeObjectURL(x.url); S.shopPhVer++; renderShop(); break; }
    case "phMain": { const [x] = S.shopPhotos.splice(+b.dataset.k, 1); if (x) S.shopPhotos.unshift(x); S.shopPhVer++; renderShop(); break; }
    case "shopPic": e.stopPropagation(); S.shopSel[id] = +b.dataset.k; renderShop(); break;
    case "shopDel": S.shopDel=id; renderShop(); break;
    case "shopDelNo": S.shopDel=null; renderShop(); break;
    case "shopDelYes": { const it = shopById(id); S.shopDel=null;
      safe(async()=>{ await shopStore.remove(id); if (it && S.assets) photosOf(it).forEach(pid => S.assets.delete(pid).catch(()=>{})); toast("Gelöscht"); }); break; }
    case "shopBought": { const it = shopById(id); if (it) safe(()=>shopStore.update(id, {bought:!it.bought})); break; }
    case "bucketToggle": { const it = bucketById(id); if (it) safe(()=>bucketStore.update(id, {done:!it.done})); break; }
    case "bucketEdit": S.bucketEdit=id; S.bucketDel=null; renderBucket(); break;
    case "bucketEditCancel": S.bucketEdit=null; renderBucket(); break;
    case "bucketDel": S.bucketDel=id; S.bucketEdit=null; renderBucket(); break;
    case "bucketDelNo": S.bucketDel=null; renderBucket(); break;
    case "bucketDelYes": S.bucketDel=null; safe(()=>bucketStore.remove(id)); break;
    case "sugNext": pickSug(S.sug); renderSuggest(); break;
    case "sugSkip": if(S.sug){ S.sugSkip.add(S.sug.ro); ls.set("jp.skip",[...S.sugSkip]); pickSug(); renderSuggest(); } break;
  }
});
document.addEventListener("input", e => { if (e.target.closest && e.target.closest("#shopForm")) shopHints(); });
document.addEventListener("change", e => {
  if (e.target.id !== "sPhoto") return;
  const fs = [...(e.target.files || [])].filter(f => /^image\//.test(f.type) || !f.type); if (!fs.length) return;
  const room = MAX_PHOTOS - S.shopPhotos.length;
  fs.slice(0, Math.max(0, room)).forEach(f => S.shopPhotos.push({file:f, url:URL.createObjectURL(f)}));
  if (fs.length > room) toast(`Höchstens ${MAX_PHOTOS} Fotos pro Item.`);
  S.shopPhVer++; renderShop();
});
document.addEventListener("submit", e => {
  if (e.target.id === "globalAuthForm"){
    e.preventDefault();
    const email=$("globalAuthEmail").value.trim(), password=$("globalAuthPassword").value;
    const mode=e.submitter?.value||"signin", status=$("globalAuthStatus");
    if(status) status.textContent=mode==="signup"?"Konto wird angelegt …":"Anmeldung läuft …";
    (async()=>{
      const result = mode==="signup"
        ? await S.supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.href.split("#")[0]}})
        : await S.supabase.auth.signInWithPassword({email,password});
      if(result.error) throw result.error;
      if(mode==="signup" && !result.data.session && status) status.textContent="Fast fertig: Bestätige deine E-Mail-Adresse über den Link, den Supabase dir schickt. Danach kannst du dich hier anmelden.";
      else if(status) status.textContent="Angemeldet. Deine privaten Daten werden geladen …";
    })().catch(err=>{ if(status) status.textContent=err.message||"Das hat nicht geklappt. Prüfe E-Mail und Passwort."; });
    return;
  }
  if (e.target.id === "shopForm"){ e.preventDefault(); shopSubmit(); return; }
  if (e.target.id === "bucketAddForm"){
    e.preventDefault();
    const inp = $("bucketInput"), text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    safe(async () => { await bucketStore.add({text, done:false, created:Date.now()}); toast("Hinzugefügt"); });
    return;
  }
  if (e.target.classList.contains("bedit")){
    e.preventDefault();
    const was = e.target.dataset.id, text = $("bEditInput").value.trim();
    if (!text) return;
    S.bucketEdit = null; renderBucket();
    safe(async () => { await bucketStore.update(was, {text}); toast("Gespeichert"); });
    return;
  }
  if (e.target.id !== "editForm") return;
  e.preventDefault();
  const o = { de:$("fDe").value.trim(), ctx:$("fCtx").value.trim(), ro:$("fRo").value.trim(), jp:$("fJp").value.trim(), cat:$("fCat").value.trim(), note:$("fNote").value.trim(), ex:false };
  if (!o.de || !o.ro) return;
  // Einheitliche Schreibweise: Romaji groß anfangen, Satzzeichen vom Deutschen übernehmen
  o.ro = o.ro.charAt(0).toUpperCase() + o.ro.slice(1);
  const end = o.de.slice(-1), JP = {".":"。","!":"！","?":"？"};
  if (JP[end]) {
    if (!/[.!?…]$/.test(o.ro)) o.ro += end;
    if (o.jp && !/[。！？…]$/.test(o.jp)) o.jp += JP[end];
  }
  const was = S.editing; S.editing = null; renderList();
  safe(async () => { if (was==="new") { await store.add(o); toast("Hinzugefügt"); } else { await store.update(was, o); toast("Gespeichert"); } });
});
document.addEventListener("keydown", e => {
  if (S.view!=="cards" || e.target.closest("input,select,textarea")) return;
  if (e.key===" " || e.key==="Enter"){ if (e.target.closest("button") && e.key==="Enter") return; e.preventDefault(); flip(); }
  else if (e.key==="1") answer(false);
  else if (e.key==="2") answer(true);
});

init();
})();
</script>
